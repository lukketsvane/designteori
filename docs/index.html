<!doctype html>
<html lang="nn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>DESIGNTEORI</title>
  <meta name="description" content="Nordisk designteori og designforsking 1900–2026. Publikasjonar, fulltekst-PDF, siteringar og semantisk søk.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="#korpus" data-tab="korpus">DESIGNTEORI</a>
    <nav aria-label="Meny">
      <button class="nav-btn active" data-tab="korpus" type="button">Katalog</button>
      <button class="nav-btn" data-tab="siteringar" type="button">Kanon</button>
      <button class="nav-btn" data-tab="kart" type="button">Kart</button>
      <button class="nav-btn" data-tab="analyse" type="button">Analyse</button>
    </nav>
  </header>

  <main>
    <section id="view-korpus" class="view active">
      <div class="metrics">
        <button class="metric metric-btn active-metric" id="metricAllBtn" type="button">
          <span class="num" id="stWorks">…</span>
          <span class="label">Publikasjonar i designteori</span>
        </button>
        <button class="metric metric-btn" id="metricPdfBtn" type="button">
          <span class="num" id="stPdfs">…</span>
          <span class="label">Fulltekst-PDF i arkivet</span>
        </button>
      </div>

      <div class="search-wrap">
        <input type="search" id="qInput" placeholder="Søk i designteori, forfattar, tidsskrift…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Søk">
      </div>

      <div class="filters">
        <select id="ccSel" aria-label="Land">
          <option value="">Alle land</option>
          <option value="NO">Noreg</option>
          <option value="SE">Sverige</option>
          <option value="DK">Danmark</option>
          <option value="FI">Finland</option>
          <option value="IS">Island</option>
        </select>

        <select id="presetSel" aria-label="Tema">
          <option value="">Alle tema</option>
          <option value="participatory-design">Deltakande design</option>
          <option value="codesign">Co-design</option>
          <option value="research-through-design">Research through Design</option>
          <option value="design-theory-epistemology">Designteori</option>
          <option value="service-systemic-design">Teneste- og systemdesign</option>
          <option value="sustainable-circular">Berekraftig design</option>
          <option value="critical-speculative">Kritisk design</option>
          <option value="interaction-hci-ai">Interaksjonsdesign</option>
          <option value="design-history-nordic">Designhistorie</option>
          <option value="craft-materiality-textile">Handverk og tekstil</option>
          <option value="aesthetics-form">Estetikk og form</option>
          <option value="design-education-pedagogy">Designdidaktikk</option>
          <option value="design-ethics-justice">Etikk og universell</option>
          <option value="design-anthropology">Designantropologi</option>
          <option value="industrial-product">Industridesign</option>
          <option value="urban-architecture">Arkitekturteori</option>
        </select>

        <select id="eraSel" aria-label="Periode">
          <option value="">1900–2026</option>
          <option value="pre2000">1900–1999</option>
          <option value="2000-2009">2000–2009</option>
          <option value="2010-2019">2010–2019</option>
          <option value="2020-2026">2020–2026</option>
        </select>

        <select id="sortSel" aria-label="Sortering">
          <option value="relevance">PDF først</option>
          <option value="citations">Mest sitert</option>
          <option value="year_desc">Nyaste</option>
          <option value="year_asc">Eldste</option>
        </select>
      </div>

      <div id="semBanner" class="sem-active" hidden>
        <span id="semBannerTxt"></span>
        <button id="clearSemBtn" type="button">Lukk</button>
      </div>

      <div class="resultline">
        <span id="hitCount">Lastar…</span>
        <button id="resetBtn" class="link-btn" type="button" hidden>Nullstill</button>
      </div>

      <div id="corpusList"></div>
      <button id="moreCorpusBtn" class="more-btn" type="button" hidden>Vis 50 fleire</button>
    </section>

    <section id="view-siteringar" class="view">
      <div class="subnav" role="tablist">
        <button class="sub-pill active" data-sub="internal" type="button">Mest sitert i Norden</button>
        <button class="sub-pill" data-sub="canon" type="button">Sitert kanon</button>
        <button class="sub-pill" data-sub="authors" type="button">Forfattarar</button>
        <button class="sub-pill" data-sub="institutions" type="button">Institusjonar</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="citQ" placeholder="Filtrer liste…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Filtrer">
      </div>
      <div id="citBox"></div>
    </section>

    <section id="view-kart" class="view">
      <div class="filters filters-2 map-controls">
        <select id="mapMode" aria-label="Fargekoding">
          <option value="cluster">Farge: klynge</option>
          <option value="country">Farge: land</option>
          <option value="pdf">Farge: PDF</option>
        </select>
        <button id="mapReset" class="btn-line" type="button">Nullstill utsnitt</button>
      </div>
      <div class="map-frame">
        <canvas id="semCanvas" width="960" height="400"></canvas>
        <div id="mapSelectedBar" class="map-bar">Trykk på eit punkt for å vise publikasjonen. Knip med to fingrar for zoom.</div>
      </div>
      <div id="mapLegend" class="cluster-grid"></div>
    </section>

    <section id="view-analyse" class="view">
      <div id="anaRoot"></div>
    </section>
  </main>

  <footer>
    <span>Nordisk designteori og designforsking (NO, SE, DK, FI, IS)</span>
    <nav class="footer-links" aria-label="Datafiler">
      <a href="https://github.com/lukketsvane/designteori/tree/main/pdf">pdf/</a>
      <a href="https://github.com/lukketsvane/designteori/raw/main/data/designteori.sqlite.gz">sqlite.gz</a>
      <a href="data/korpus.csv" download>korpus.csv</a>
      <a href="https://github.com/lukketsvane/designteori">GitHub</a>
    </nav>
  </footer>

  <script src="app.js"></script>
</body>
</html>
