name: DESIGNTEORI quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PYTHONPATH: scripts
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests forsking
      - name: Reconcile source metadata
        run: |
          python scripts/batch_import_norden.py
          python scripts/samkoyr_norden.py
          python scripts/bygg_teoriregister.py
          python scripts/bygg_dekningsoversikt.py
      - name: Export searchable corpus and identity audit
        run: |
          python scripts/eksporter_korpus.py
          python scripts/lag_identitetsko.py
      - name: Rebuild offline queues
        run: |
          python scripts/bygg_referansefrontier.py --limit 5000 --min-citing 2
          python scripts/hent_oa_pdf.py
      - name: Rebuild combined SQLite
        run: python scripts/bygg_hovuddatabase.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate dataset, licensing, and checksums
        run: python tests/test_database.py
      - name: Check patch formatting
        run: git diff --check
