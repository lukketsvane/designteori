name: Datakvalitet · nordisk designteori
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sjekk Python-kode for katalog og innsamling
        run: python -m py_compile collect.py bygg_katalog.py bygg_hovuddatabase.py bygg_bibliografiportal.py test_database.py
      - name: Kontroller metadata, kjelder, dublett-ID-ar, teljingar og lisensar
        run: python test_database.py
