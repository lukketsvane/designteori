name: DESIGNTEORI · verifisering
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: designteori-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !pdf/
            pdf/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer kjernepakkar for verifisering
        run: python -m pip install --upgrade pip numpy pytest
      - name: Syntakskontroll
        run: python -m compileall -q designteori.py designteori tests
      - name: Køyr einings- og integrasjonstestar
        run: python -m unittest discover -s tests -v
      - name: Køyr testane som er skrivne for pytest
        run: python -m pytest tests/test_teorielement_prep.py -q
      - name: Verifiser database, sjekksummar, kjeldelag og Google-embeddingar
        run: python designteori.py verify
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Køyr JavaScript-testar for søk, eksport og grensesnitt (node:test, ingen avhengigheiter)
        run: |
          if ls tests/js/*.test.mjs >/dev/null 2>&1; then
            node --test tests/js/*.test.mjs
          fi
