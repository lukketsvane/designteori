name: Kontroll av forskingsarkivet
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kontroller metadata, kjeldekonsistens, lisensar og SHA-256
        run: python test_publisering.py
      - name: Kontroller hypotesar, representativ kontrollkø og blanke kodingsark
        run: python forsking/test_protokoll.py
      - name: Kontroller sidestader og filhashar for piloten
        run: python forsking/verifiser_pilot.py
