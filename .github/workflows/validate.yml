name: Nordisk database · kvalitet
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: nordic-database-reconciliation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntaks
        run: python -m py_compile collect.py import_norden.py samkoyr_norden.py bygg_katalog.py bygg_hovuddatabase.py bygg_bibliografiportal.py test_database.py test_nordic_import.py
      - name: Avstem nordiske kjelder
        run: python samkoyr_norden.py
      - name: Test import og DOI-identitet
        run: python -m unittest -v test_nordic_import
      - name: Kontroller databasen
        run: python test_database.py
      - name: Publiser kjeldeavstemming
        if: github.event_name == 'push'
        run: |
          git add docs/data/nordic_additions.json docs/data/nordic_status.json docs/data/source_links.json results/nordic_source_audit.csv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Reconcile Nordic bibliography and repository sources [skip ci]"
            git push origin HEAD:main
          fi
