name: DESIGNTEORI · verifisering
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: designteori-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !pdf/
            pdf/manifest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer kjernepakkar for verifisering
        run: python -m pip install --upgrade pip numpy
      - name: Syntakskontroll
        run: python -m compileall -q designteori.py designteori tests
      - name: Køyr einings- og integrasjonstestar
        run: python -m unittest discover -s tests -v
      - name: Verifiser database, sjekksummar, kjeldelag og Google-embeddingar
        run: python designteori.py verify
